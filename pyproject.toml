[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "photidy"
version = "0.2.0"
description = "A simple photo organisation tool"
requires-python = ">=3.11"
authors = [
    {name = "Rob Webb", email = "rdawebb@gmail.com"}
]
dependencies = [
    "appdirs>=1.4,<2.0",
    "pygments>=2.20.0",
    "pyside6>=6.11.0,<6.12",
    "typer-extensions>=0.2.2,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "icecream>=2.2.0,<3.0.0",
    "maturin>=1.13.3,<2.0",
    "prek>=0.4.0,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.12,<1.0.0",
    "rust-just>=1.51.0,<2.0.0",
    "ty>=0.0.35,<0.1.0",
]

[project.scripts]
photidy = "src.cli.cli:app"

[tool.maturin]
module-name = "_photidy"
python-packages = ["src"]
manifest-path = "rust/_photidy/Cargo.toml"
