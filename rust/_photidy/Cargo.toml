[package]
name = "photidy"
version = "0.1.0"
edition = "2021"

[lib]
name = "_photidy"
crate-type = ["cdylib"]

[features]
default = []
build-db = ["ahash", "bzip2", "flate2", "memchr", "rayon", "sonic-rs", "ureq"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
rusqlite = { version = "0.40", features = ["bundled"] }
kamadak-exif = "0.6.1"
once_cell = "1.21.4"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.44"
percent-encoding = "2.3.2"

[dependencies.ahash]
version  = "0.8.12"
features = ["serde"]
optional = true

[dependencies.bzip2]
version  = "0.6.1"
optional = true

[dependencies.flate2]
version  = "1.1.9"
features = ["zlib-ng-compat"]
default-features = false
optional = true

[dependencies.memchr]
version  = "2.8.1"
optional = true

[dependencies.rayon]
version  = "1.12.0"
optional = true

[dependencies.sonic-rs]
version  = "0.5.8"
optional = true

[dependencies.ureq]
version  = "3.3.0"
optional = true

[dev-dependencies]
tempfile = "3.27"
